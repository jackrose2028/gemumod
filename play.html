<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Playing – EmulatorJS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111418">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EmulatorJS">
    <meta name="format-detection" content="telephone=no">
    <link rel="apple-touch-icon" href="docs/Logo.png">
    <link rel="icon" href="docs/favicon.ico" sizes="16x16 32x32 48x48 64x64" type="image/vnd.microsoft.icon">
    <link rel="manifest" href="manifest.webmanifest">
    <script src="assets/early-view.js"></script>
    <link rel="stylesheet" href="assets/app.css">
</head>
<body class="play">
    <header id="bar">
        <a id="home" class="button" href="index.html" title="Back to the home page and game library">&#8592; Home</a>
        <a id="links" class="button" href="links.html" title="All parts of this site, including ObsoleteMod">Links</a>
        <h1 id="title">Loading…</h1>
        <button id="menuBtn" class="icon-btn m-only" type="button" aria-label="Game menu" aria-controls="sheet" aria-expanded="false">&#9776;</button>
        <div class="pickers">
            <label for="platformSelect">Platform</label>
            <select id="platformSelect" title="Choose a console to list its games"></select>
            <label for="gameSelect">Game</label>
            <select id="gameSelect" title="Choose a game to start it"></select>
        </div>
        <div class="pickers">
            <label for="engineSelect">Engine</label>
            <select id="engineSelect" title="Which emulation engine runs the game; changing it restarts the game"></select>
        </div>
        <span id="hint" class="muted small hint"></span>
        <div id="engineTools" class="engine-tools"></div>
    </header>
    <main id="display"><div id="game"></div></main>
    <!-- Phone view: the bar hides in landscape; this button brings the game menu back -->
    <button id="floatMenu" class="m-only" type="button" aria-label="Game menu" aria-controls="sheet">&#8943;</button>
    <div id="sheet" class="sheet" hidden>
        <div class="sheet-backdrop" data-close></div>
        <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <div class="sheet-grab" data-close aria-hidden="true"></div>
            <header class="sheet-head">
                <h2 id="sheetTitle">Game menu</h2>
                <button class="icon-btn" type="button" data-close aria-label="Close menu">&#10005;</button>
            </header>
            <p id="sheetStatus" class="muted small">The game is paused while this menu is open.</p>
            <div id="sheetTools" class="sheet-tools"></div>
            <div id="sheetPickers" class="sheet-pickers"></div>
            <div class="sheet-row" id="sheetControls"></div>
            <nav class="sheet-links" aria-label="Site">
                <a class="button" href="index.html">Home</a>
                <a class="button" href="play.html">Library</a>
                <a class="button" href="links.html">Links</a>
                <a class="button" href="reference.html">Docs</a>
            </nav>
            <p id="a2hs" class="a2hs" hidden>For full screen on iPhone: tap <strong>Share</strong> <span aria-hidden="true">&#x2191;&#xFE0E;</span> then <strong>Add to Home Screen</strong>, and start games from the new icon. Games then open full screen, and Safari keeps your saves more reliably.</p>
        </section>
    </div>
    <div id="banners" aria-live="polite"></div>
    <script type="module" src="assets/play.js"></script>
</body>
</html>
